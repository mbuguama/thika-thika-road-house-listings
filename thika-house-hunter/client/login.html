<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign In - Thika House Hunter</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="index.html">Thika<span class="brand-accent">House</span></a>
        <nav class="main-nav">
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <a href="explore.html">Explore</a>
        </nav>
      </div>
    </header>

    <main class="auth-page">
      <div class="auth-container">
        <div class="auth-card">
          <p class="auth-eyebrow">Thika House Hunter account</p>
          <h1>Sign In</h1>
          <p class="auth-subtitle">Access your account to manage listings and bookings.</p>

          <form id="login-form" class="auth-form">
            <div class="form-field">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required />
            </div>
            <div class="form-field">
              <label for="password">Password</label>
              <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required />
            </div>
            <div class="form-actions">
              <button type="submit" class="button button-primary">Sign In</button>
            </div>
            <div id="login-message" class="auth-message"></div>
          </form>

          <p class="auth-footer">Don't have an account? <a href="register.html">Create one</a></p>
          <p class="auth-legal-links"><a href="privacy.html">Privacy</a> <span aria-hidden="true">|</span> <a href="terms.html">Terms</a> <span aria-hidden="true">|</span> <a href="contact.html">Contact</a></p>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-content">
        <p>&copy; 2026 Thika House Hunter. All rights reserved.</p>
        <nav class="footer-nav">
          <a href="privacy.html">Privacy</a>
          <a href="terms.html">Terms</a>
          <a href="contact.html">Contact</a>
        </nav>
      </div>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/mobile-menu.js"></script>
  </body>
</html>
