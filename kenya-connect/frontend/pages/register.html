<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create Account - Connect254</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/css/main.css" />
  </head>
  <body>
    <header class="site-header"><div class="shell header-inner"><a class="brand" href="/">Connect<span>254</span></a><nav class="nav open"><a href="/pages/login.html">Login</a><a href="/pages/discovery.html">Discover</a></nav></div></header>
    <main class="auth-page shell">
      <section class="auth-card">
        <p class="eyebrow">Adults only</p>
        <h1>Create account</h1>
        <p class="hero-copy">Connect254 is only for people aged 18 and above.</p>
        <form id="registerForm">
          <label class="field"><span>Display name</span><input name="display_name" required /></label>
          <label class="field"><span>Email</span><input name="email" type="email" autocomplete="email" required /></label>
          <label class="field"><span>Password</span><input name="password" type="password" autocomplete="new-password" minlength="8" required /></label>
          <label class="field"><span>Age</span><input name="age" type="number" min="18" max="99" required /></label>
          <label class="field"><span>Town</span><select name="town"><option>Nairobi</option><option>Mombasa</option><option>Kisumu</option><option>Nakuru</option><option>Eldoret</option><option>Thika</option><option>Kiambu</option><option>Ruiru</option><option>Machakos</option><option>Nyeri</option><option>Meru</option></select></label>
          <label class="field"><span>Relationship goal</span><select name="relationship_goal"><option>Long-term dating</option><option>Casual connection</option><option>Friendship first</option><option>Mature dating</option></select></label>
          <button class="button button-primary" type="submit">Create account</button>
          <p class="form-message" id="formMessage"></p>
        </form>
      </section>
    </main>
    <script src="/js/config.js"></script><script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/ui.js"></script>
  </body>
</html>
