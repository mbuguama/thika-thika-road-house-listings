<!DOCTYPE html>
<html lang="en">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Forgot Password - Connect254</title><link rel="stylesheet" href="/css/main.css" /></head>
  <body>
    <header class="site-header"><div class="shell header-inner"><a class="brand" href="/">Connect<span>254</span></a><nav class="nav open"><a href="/pages/login.html">Login</a></nav></div></header>
    <main class="auth-page shell">
      <section class="auth-card">
        <p class="eyebrow">Account recovery</p>
        <h1>Reset password</h1>
        <form id="forgotForm">
          <label class="field"><span>Email</span><input name="email" type="email" required /></label>
          <button class="button button-primary" type="submit">Send reset link</button>
          <p class="form-message" id="formMessage"></p>
        </form>
      </section>
    </main>
    <script src="/js/config.js"></script><script src="/js/api.js"></script><script src="/js/auth.js"></script><script src="/js/ui.js"></script>
  </body>
</html>
